name: Vercel Deploy

# Deploys via the Vercel CLI instead of Vercel's native GitHub App integration — same reason as
# the other 3 Protegey frontend repos (protegey-admin-web, protegey-partner-web,
# protegey-facetec-web): this repo is private under the protegey org, and Vercel's free Hobby
# plan can't deploy from a private org-owned repo through that integration (confirmed by a
# "Failed deployment ... Upgrade to Pro" email after the repo was made private — the native
# integration had been silently failing every push since). The CLI run here doesn't need Vercel
# to have read access to the repo at all; the build happens on the runner, only the compiled
# .vercel/output folder is uploaded.
#
# Unlike the other 3 repos, this one has no dev/prod branch split (single `master`, single Vercel
# project) — every push to master is this project's one production deploy.
#
# Needs 3 repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN      — can reuse the same token already set on the other 3 frontend repos
#   VERCEL_ORG_ID     — can reuse the same org ID already set on the other 3 frontend repos
#   VERCEL_PROJECT_ID — this project's own id (Vercel dashboard -> this project -> Settings -> General)

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        # Nitro auto-detects its deploy target from env vars (std-env's provider list), and
        # GITHUB_ACTIONS (set automatically by the runner) is checked before VERCEL in that list —
        # so inside this workflow Nitro silently falls back to the generic "node-server" preset
        # (output in .output/server) instead of "vercel" (.vercel/output), and `vercel build` then
        # fails with [STATIC_BUILD_NO_OUT_DIR] because it can't find a Vercel-shaped output.
        # Forcing the preset here sidesteps the misdetection entirely.
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NITRO_PRESET: vercel

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
